<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101522">
  <meta name="description" content="Jednoduchý odpočítávač.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Odpočítávač</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100svh; display: grid; place-items: center; padding: 24px;
      background: linear-gradient(rgba(0,0,0,.28), rgba(0,0,0,.38)), url("background.jpg") center center / cover no-repeat fixed;
      color: #fff;
    }
    main { width: min(100%, 520px); text-align: center; }
    .heading { margin-bottom: 24px; font-size: clamp(1.15rem, 4.5vw, 1.6rem); font-weight: 500; color: #fff; letter-spacing: .02em; text-shadow: 0 2px 12px rgba(0,0,0,.65); }
    .counter {
      font-size: clamp(6rem, 27vw, 12rem); font-weight: 750; line-height: .95;
      letter-spacing: -.075em; font-variant-numeric: tabular-nums;
      text-shadow: 0 10px 40px rgba(0,0,0,.24);
    }
    .unit { margin-top: 20px; font-size: clamp(1.1rem, 4vw, 1.6rem); font-weight: 500; color: #c7d1e7; letter-spacing: .08em; }
    @media (prefers-reduced-motion: no-preference) {
      .counter { animation: appear .7s ease-out both; }
      @keyframes appear { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    }
  </style>
</head>
<body>
  <main aria-label="Odpočítávání">
    <div class="heading">Do Vaší dovolené zbývá</div>
    <div class="counter" id="days" aria-live="polite">…</div>
    <div class="unit" id="unit">dní</div>
  </main>
  <script>
    // Cílové datum: 28. ledna 2027. Číslo měsíce je v JavaScriptu od nuly.
    const targetDate = new Date(2027, 0, 28);
    targetDate.setHours(0, 0, 0, 0);

    function updateCountdown() {
      const now = new Date();
      now.setHours(0, 0, 0, 0);
      const diff = targetDate.getTime() - now.getTime();
      const days = Math.max(0, Math.ceil(diff / 86400000));
      document.getElementById("days").textContent = days;
      document.getElementById("unit").textContent =
        days === 1 ? "den" : (days >= 2 && days <= 4 ? "dny" : "dní");
    }
    updateCountdown();
    setInterval(updateCountdown, 60 * 60 * 1000);

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
